name = "alo-bunici-waitlist"
main = "src/index.js"
workers_dev = true
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGIN = "https://suroshahmadzobair.github.io"

# Daily retention sweep: rows older than 12 months are deleted (scheduled() in src/index.js).
[triggers]
crons = ["17 3 * * *"]

# Created with: wrangler d1 create alo-bunici-waitlist-eu --jurisdiction eu
[[d1_databases]]
binding = "DB"
database_name = "alo-bunici-waitlist-eu"
database_id = "792e3dc6-a906-4fef-aa39-6ca9ba3611a4"
migrations_dir = "migrations"

# Per-IP rate limits (period must be 10 or 60 seconds). The IP is only the counter key; it is never stored.
[[ratelimits]]
name = "RL_SIGNUP"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_MESSAGE"
namespace_id = "1002"
simple = { limit = 3, period = 60 }
